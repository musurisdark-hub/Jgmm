<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastro de Membros | Musuris</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #374151);

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 100%;
      max-width: 450px;

      background: white;
      padding: 30px;

      border-radius: 20px;

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.25);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      color: #111827;
    }

    .descricao {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;

      font-weight: bold;
      color: #374151;
    }

    input {
      width: 100%;

      padding: 13px;

      border: 1px solid #d1d5db;
      border-radius: 10px;

      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #111827;
    }

    button {
      width: 100%;

      margin-top: 25px;
      padding: 15px;

      border: none;
      border-radius: 10px;

      background: #111827;
      color: white;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      background: #374151;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #mensagem {
      margin-top: 18px;

      text-align: center;

      font-weight: bold;
    }

    .sucesso {
      color: #15803d;
    }

    .erro {
      color: #dc2626;
    }

    .voltar {
      display: block;

      margin-top: 20px;

      text-align: center;

      color: #374151;
      text-decoration: none;
    }

    .voltar:hover {
      text-decoration: underline;
    }
  </style>
</head>


<body>


  <div class="card">

    <h1>
      Cadastro de Membros
    </h1>


    <p class="descricao">
      Preencha seus dados para realizar o cadastro.
    </p>


    <form id="cadastroForm">


      <!-- NOME -->

      <label for="nome">
        Nome
      </label>

      <input
        type="text"
        id="nome"
        name="nome"
        placeholder="Digite seu nome"
        required
      >


      <!-- EMAIL -->

      <label for="email">
        E-mail
      </label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="Digite seu e-mail"
        required
      >


      <!-- TELEFONE -->

      <label for="telefone">
        Telefone
      </label>

      <input
        type="tel"
        id="telefone"
        name="telefone"
        placeholder="Digite seu telefone"
        required
      >


      <!-- CIDADE -->

      <label for="cidade">
        Cidade
      </label>

      <input
        type="text"
        id="cidade"
        name="cidade"
        placeholder="Digite sua cidade"
        required
      >


      <!-- DATA DE NASCIMENTO -->

      <label for="data_nascimento">
        Data de nascimento
      </label>

      <input
        type="date"
        id="data_nascimento"
        name="data_nascimento"
        required
      >


      <!-- BOTÃO -->

      <button
        type="submit"
        id="botao"
      >
        CADASTRAR
      </button>


    </form>


    <div id="mensagem"></div>


    <a
      href="index.html"
      class="voltar"
    >
      ← Voltar para o site
    </a>

  </div>



<script>


  /* =====================================
     CONFIGURAÇÃO DO SUPABASE
     ===================================== */

  const SUPABASE_URL =
    "https://ynmzjnmlyfowxgpayhyr.supabase.co";


  const SUPABASE_KEY =
    "sb_publishable_vo8QrMPS7SNHXjpD_oK0Ug_dZBzwSo8";



  /* =====================================
     FORMULÁRIO
     ===================================== */

  const formulario =
    document.getElementById("cadastroForm");


  const botao =
    document.getElementById("botao");


  const mensagem =
    document.getElementById("mensagem");



  formulario.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      /* Pegar os valores */

      const nome =
        document
          .getElementById("nome")
          .value
          .trim();


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const telefone =
        document
          .getElementById("telefone")
          .value
          .trim();


      const cidade =
        document
          .getElementById("cidade")
          .value
          .trim();


      const dataNascimento =
        document
          .getElementById("data_nascimento")
          .value;



      /* Preparar botão */

      botao.disabled = true;

      botao.textContent =
        "CADASTRANDO...";


      mensagem.textContent = "";

      mensagem.className = "";



      try {


        /* =====================================
           ENVIAR PARA SUPABASE
           ===================================== */

        const resposta =
          await fetch(
            SUPABASE_URL +
            "/rest/v1/membros",
            {

              method: "POST",


              headers: {

                "Content-Type":
                  "application/json",

                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  "Bearer " +
                  SUPABASE_KEY,

                "Prefer":
                  "return=minimal"

              },


              body:
                JSON.stringify({

                  nome:
                    nome,

                  email:
                    email,

                  telefone:
                    telefone,

                  cidade:
                    cidade,

                  data_nascimento:
                    dataNascimento

                })

            }
          );



        /* =====================================
           VERIFICAR RESULTADO
           ===================================== */

        if (!resposta.ok) {

          const erro =
            await resposta.text();


          console.error(
            "Erro do Supabase:",
            erro
          );


          throw new Error(erro);

        }



        /* =====================================
           SUCESSO
           ===================================== */

        mensagem.textContent =
          "✅ Cadastro realizado com sucesso!";


        mensagem.className =
          "sucesso";


        formulario.reset();



      } catch (erro) {


        console.error(erro);


        mensagem.textContent =
          "❌ Não foi possível realizar o cadastro.";


        mensagem.className =
          "erro";

      }



      /* Restaurar botão */

      botao.disabled = false;

      botao.textContent =
        "CADASTRAR";

    }

  );

</script>


</body>
</html>
